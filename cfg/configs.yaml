agi_logger:
  verbosity: INFO
  logger:
    bag_path: /workspaces/logging/test_bags
    topics:
    - /clock
    - /fmu/out/vehicle_control_mode
    - /fmu/out/vehicle_status
    - /drone0/RealSense_Camera/color/camera_info
    - /drone0/RealSense_Camera/color/image_raw
    - /drone0/RealSense_Camera/depth
    - /drone0/alert_event
    - /drone0/dynamic_map/voxel_map
    - /drone0/fast_lio/Laser_map
    - /drone0/fast_lio/imu_odometry
    - /drone0/livox/lidar
    - /drone0/livox/imu
    - /drone0/self_localization/pose
    - /drone0/sensor_measurements/imu
    - /drone0/navigation_runner/goal
    - /drone0/self_localization/path
    - /tf
    - /tf_static
    name: test_log
    max_bag_size: 1
    override_qos: false
    qos_settings: cfg/qos_profiles.yaml
    compress: true
    duration: 10
    mcap: true
    read_ahead_queue_size: 10000
    max_cache_size: 104857600
    auto_start: true
    auto_start_behavior: toggle_arm
    auto_start_topic: /drone0/platform/info
  tcp_file_communication:
    mode: ask
    server:
      port: 6000
      file_path: /workspaces/logging/bags/agi_log_20260128_115034_climb_test
    client:
      host: 192.168.0.85
      port: 6000
      destination_path: /workspaces/logging/test_recieve
