agi_logger:
  verbosity: INFO
  logger:
    bag_path: /workspaces/logging/test_bags/after_fix_1_and_2
    topics:
    - /drone0/livox/lidar
    - /drone0/livox/imu
    - /camera/camera/color/image_raw/compressed
    - /camera/camera/color/camera_info
    - /drone0/camera/image/compressed
    - /drone0/camera/camera_info
    - /drone0/px4_imu
    - /drone0/adaptive_lio/state/odom
    - /drone0/adaptive_lio/odometry_path
    - /drone0/adaptive_lio/scan
    - /fmu/out/vehicle_gps_position
    - /tf
    - /tf_static
    name: forrest_test_1
    max_bag_size: 1
    override_qos: false
    qos_settings: cfg/qos_profiles.yaml
    compress: true
    duration: 10
    mcap: true
    read_ahead_queue_size: 10000
    max_cache_size: 104857600
    auto_start: true
    auto_start_behavior: toggle_arm
    auto_start_topic: /fmu/out/vehicle_status_v1   # PX4 arming state (Aerostack2 platform/info was removed with Option C)
  # Flight sessions: one folder per arm -> disarm with a curated flight log (always), an optional full
  # diagnostic log, a manifest (mission, configs, versions) and the stack's files written during the flight.
  # Independent of the bag recording above; armed state comes from logger.auto_start_topic.
  flight_session:
    enabled: true
    namespace: drone0
    session_path: /workspaces/logging/flights
    name: ''                       # appended to the session folder name
    disarm_grace_s: 5.0            # keep recording this long after disarm; a re-arm within it continues the session
    flight_log: true
    diagnostic: false              # also record the 'diagnostic' profile
    health_period_s: 2.0           # /agi_logger/health (CPU, RAM, disk, temperature) in every log
    recorder_stop_timeout_s: 15.0
    segment_s: 10.0               # logs are split into complete 10 s MCAP segments (a crash loses at most one)
    chunk_bytes: 32768            # small zstd chunks so data reaches the disk within seconds
    profiles:
      flight:                      # small: meant to be pulled over Wi-Fi right after landing
        topics:
        - {topic: /fmu/out/vehicle_status_v1, max_hz: 5}
        - {topic: /fmu/out/vehicle_land_detected, max_hz: 5}
        - {topic: /fmu/out/vehicle_local_position_v1, max_hz: 20}
        - {topic: /fmu/out/battery_status_v1, max_hz: 1}
        - {topic: /fmu/out/vehicle_command_ack}
        - {topic: /fmu/in/vehicle_command}
        - {topic: /fmu/in/vehicle_attitude_setpoint_v1, max_hz: 20}
        - {topic: '/{ns}/agiptive_liom/state/odom', max_hz: 20}
        - {topic: '/{ns}/agiptive_liom/solve/diag'}
        - {topic: '/{ns}/mocap/odom', max_hz: 20}
        - {topic: '/{ns}/px4/battery', max_hz: 1}
        - {topic: '/{ns}/px4/gps', max_hz: 2}
        - {topic: '/{ns}/auto/status', max_hz: 2}       # ~600-char string at 20 Hz: full rate only in the diagnostic log
        - {topic: '/{ns}/auto/viz/waypoints', max_hz: 0.2}
        - {topic: '/{ns}/logger/session', latched: true}
        - {topic: /tf_static, latched: true}
        - {topic: /rosout, min_level: 30}        # WARN and above
        - {topic: '/{ns}/camera/image/compressed', thumbnail: {max_hz: 1, width: 320, quality: 70}}
      diagnostic:                  # full rates for debugging; much larger
        topics:
        - /fmu/out/vehicle_status_v1
        - /fmu/out/vehicle_land_detected
        - /fmu/out/vehicle_local_position_v1
        - /fmu/out/vehicle_odometry
        - /fmu/out/sensor_combined
        - /fmu/out/battery_status_v1
        - /fmu/out/vehicle_command_ack
        - /fmu/in/vehicle_command
        - /fmu/in/vehicle_attitude_setpoint_v1
        - /fmu/in/vehicle_visual_odometry
        - '/{ns}/livox/imu'
        - '/{ns}/px4/imu'
        - '/{ns}/agiptive_liom/state/odom'
        - '/{ns}/agiptive_liom/lio/pose'
        - '/{ns}/agiptive_liom/solve/diag'
        - '/{ns}/mocap/odom'
        - '/{ns}/auto/status'
        - '/{ns}/auto/viz/waypoints'
        - '/{ns}/logger/session'
        - /tf
        - {topic: /tf_static, latched: true}
        - /rosout
        - {topic: '/{ns}/camera/image/compressed', thumbnail: {max_hz: 5, width: 640, quality: 80}}
    manifest:
      repos:                       # git commit / branch / dirty of each, recorded in the manifest
      - /workspaces/agipix_control/src/agipix_autonomy
      - /workspaces/lidar_ws/src/AGIptive-LIOM
      - /workspaces/logging/src/agi_logger
      processes:                   # command lines (and the config/param files they reference) of these processes
      - '*/lib/agipix_auto/agipix_auto *'
      - '*ros2 launch agipix_auto *'
      - '*/lib/agiptive_liom/agiptive_liom *'
      - '*/lib/agipix_px4_bridge/agipix_px4_bridge_node *'
      - '*/lib/agipix_tf/agipix_tf_node *'
      - 'MicroXRCEAgent *'
      - '*tools/runagi.sh *'
      - '*examples/8_agipix*.py *'
      env_prefixes: [AGIPIX_, ROS_DOMAIN_ID, RMW_IMPLEMENTATION]
      extra_files: []              # more config files to copy into the session
    collect:                       # files modified during the flight are copied into <session>/files/
    - ~/.ros/agiptive_liom/*.csv
    - ~/.ros/agiptive_liom/*.txt
    - ~/.ros/agipix_traces/*
  tcp_file_communication:
    mode: ask
    server:
      port: 6000
      file_path: /workspaces/logging/bags/agi_log_20260128_115034_climb_test
      host: 0.0.0.0
    client:
      host: 192.168.0.85
      port: 6000
      destination_path: /workspaces/logging/test_recieve
