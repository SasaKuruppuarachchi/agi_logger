[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-logger"
version = "1.2.0"
description = "AGI logger CLI and ROS2 autostart node"
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=6.0"
]

[tool.setuptools]
packages = ["agi_logger", "agi_logger.reader"]

[tool.setuptools.package-data]
"agi_logger.reader" = ["static/*.html"]

[project.scripts]
agi-logger = "agi_logger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=/tmp/pytest_agi_logger"
